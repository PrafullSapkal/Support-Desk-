<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Support Desk</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>Support Desk</h1>
    <span class="sub">Support Ticket Management System</span>
  </header>

  <main class="container">
    <section class="stats" id="stats"></section>

    <section class="card">
      <h2>Create ticket</h2>
      <form id="ticketForm" class="grid">
        <label>Title
          <input name="title" maxlength="150" required>
        </label>
        <label>Category
          <input name="category" maxlength="50" placeholder="Login, Database, Performance..." required>
        </label>
        <label>Priority
          <select name="priority">
            <option>LOW</option>
            <option selected>MEDIUM</option>
            <option>HIGH</option>
            <option>CRITICAL</option>
          </select>
        </label>
        <label>Reported by
          <input name="reportedBy" maxlength="100" required>
        </label>
        <label>Assigned to (optional)
          <input name="assignedTo" maxlength="100">
        </label>
        <label class="wide">Description
          <textarea name="description" rows="3" maxlength="2000" required></textarea>
        </label>
        <div class="wide actions">
          <button type="submit">Create ticket</button>
          <span id="formMsg" class="msg"></span>
        </div>
      </form>
    </section>

    <section class="card">
      <div class="toolbar">
        <h2>Tickets</h2>
        <div class="filters">
          <input id="search" type="search" placeholder="Search title or description">
          <select id="filterStatus">
            <option value="">All statuses</option>
            <option>OPEN</option>
            <option>IN_PROGRESS</option>
            <option>RESOLVED</option>
            <option>CLOSED</option>
          </select>
          <select id="filterPriority">
            <option value="">All priorities</option>
            <option>LOW</option>
            <option>MEDIUM</option>
            <option>HIGH</option>
            <option>CRITICAL</option>
          </select>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>ID</th><th>Title</th><th>Category</th><th>Priority</th><th>Status</th><th>Assigned</th><th>Created</th></tr>
          </thead>
          <tbody id="ticketRows"></tbody>
        </table>
      </div>
      <p id="emptyMsg" class="msg" hidden>No tickets found.</p>
    </section>

    <section class="card" id="detail" hidden>
      <div class="toolbar">
        <h2 id="detailTitle"></h2>
        <button id="closeDetail" class="secondary" type="button">Close</button>
      </div>
      <p id="detailMeta" class="meta"></p>
      <p id="detailDesc"></p>

      <div class="actions">
        <label>Status
          <select id="detailStatus">
            <option>OPEN</option>
            <option>IN_PROGRESS</option>
            <option>RESOLVED</option>
            <option>CLOSED</option>
          </select>
        </label>
        <button id="deleteTicket" class="danger" type="button">Delete ticket</button>
      </div>

      <h3>Comments</h3>
      <ul id="comments" class="comments"></ul>
      <form id="commentForm" class="grid">
        <label>Your name
          <input name="author" maxlength="100" required>
        </label>
        <label class="wide">Comment
          <textarea name="message" rows="2" maxlength="1000" required></textarea>
        </label>
        <div class="wide actions"><button type="submit">Add comment</button></div>
      </form>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
