# Run with: --spring.profiles.active=mysql
# Create the database first:  CREATE DATABASE supportdesk;
spring.datasource.url=jdbc:mysql://localhost:3306/supportdesk?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.h2.console.enabled=false

spring.jpa.hibernate.ddl-auto=update
